[package]
name = "top-rail"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["2d", "ui", "bevy_feathers", "bevy_dev_tools"] }
bevy_framepace = "0.22"
serde = { version = "1.0", features = ["derive"] }
ron = "0.12.2"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

